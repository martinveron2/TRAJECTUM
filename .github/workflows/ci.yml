name: monorepo-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core, physics, cad, validation, api, reporting]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install module
        run: |
          if [ "${{ matrix.module }}" = "api" ]; then
            pip install -e "backend/physics[dev]"
            pip install -e "backend/cad[dev]"
            pip install -e "backend/api[dev]"
          else
            pip install -e "backend/${{ matrix.module }}[dev]"
          fi
      - run: pytest -q
        working-directory: backend/${{ matrix.module }}
      - run: ruff check .
        working-directory: backend/${{ matrix.module }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm install
      - run: npm run check
      - run: npm run build

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8' 'ruff>=0.6'
      - name: Verify engineering data catalog and schemas
        run: pytest -q tests/test_data_contract.py
      - run: ruff check tests/test_data_contract.py
